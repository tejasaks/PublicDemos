# =============================================================================
# GitHub Actions Workflow: Build and Push Operator Images
# =============================================================================
# 
# This workflow builds and pushes the SQL Server Kubernetes Operator images
# to GitHub Container Registry (ghcr.io).
#
# IMAGES BUILT:
#   - mssql-operator     : Main controller
#   - mssql-ag-helper    : AG monitoring sidecar
#
# TRIGGERS:
#   - Push to main branch (when SQLK8sOperator code/build files change)
#     Docs, samples, tests, and markdown-only changes are excluded.
#   - Git tag push (v*.*.*)
#   - Manual trigger (workflow_dispatch)
#
# IMAGE TAGS:
#   - On main push: latest, main, sha-<commit>, v1.0.0
#   - On tag push: v1.0.0, latest (if not pre-release)
#
# USAGE:
#   Place this file at: PublicDemos/.github/workflows/build-operator.yaml
#
# =============================================================================

name: Build and Push Operator Images

on:
  push:
    branches:
      - main
    paths:
      # Go source and build files that affect the compiled binaries/images.
      # NOTE: If you add a new folder under SQLK8sOperator/ that contains
      # build-relevant code, add it here to trigger CI.
      - 'SQLK8sOperator/cmd/**'
      - 'SQLK8sOperator/internal/**'
      - 'SQLK8sOperator/pkg/**'
      - 'SQLK8sOperator/hack/**'
      - 'SQLK8sOperator/deploy/**'
      - 'SQLK8sOperator/go.mod'
      - 'SQLK8sOperator/go.sum'
      - 'SQLK8sOperator/Makefile'
      - 'SQLK8sOperator/Dockerfile*'
      - 'SQLK8sOperator/install.yaml'
      - '.github/workflows/build-operator.yaml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v1.0.0). Leave empty for dev build.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  OPERATOR_IMAGE: tejasaks/mssql-operator
  AG_HELPER_IMAGE: tejasaks/mssql-ag-helper

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases
      packages: write  # For pushing to ghcr.io

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: SQLK8sOperator/go.sum

      - name: Run tests
        working-directory: SQLK8sOperator
        run: |
          go mod download
          go test ./... -v -short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================================================
      # Build mssql-operator image
      # =====================================================================
      - name: Extract metadata for Operator
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=v1.0.0,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Operator image
        uses: docker/build-push-action@v5
        with:
          context: ./SQLK8sOperator
          file: ./SQLK8sOperator/Dockerfile.operator
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # =====================================================================
      # Build mssql-ag-helper image
      # =====================================================================
      - name: Extract metadata for AG Helper
        id: meta-ag-helper
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AG_HELPER_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=v1.0.0,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push AG Helper image
        uses: docker/build-push-action@v5
        with:
          context: ./SQLK8sOperator
          file: ./SQLK8sOperator/Dockerfile.ag-helper
          push: true
          tags: ${{ steps.meta-ag-helper.outputs.tags }}
          labels: ${{ steps.meta-ag-helper.outputs.labels }}
          cache-from: type=gha,scope=ag-helper
          cache-to: type=gha,mode=max,scope=ag-helper
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # =====================================================================
      # Create Release (on tag push)
      # =====================================================================
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## SQL Server Kubernetes Operator ${{ github.ref_name }}
            
            ### Installation
            
            ```bash
            kubectl apply -f https://raw.githubusercontent.com/tejasaks/PublicDemos/${{ github.ref_name }}/SQLK8sOperator/install.yaml
            ```
            
            ### Docker Images
            
            | Image | Tag |
            |-------|-----|
            | Operator | `ghcr.io/tejasaks/mssql-operator:${{ github.ref_name }}` |
            | AG Helper | `ghcr.io/tejasaks/mssql-ag-helper:${{ github.ref_name }}` |
            
            ### Upgrade
            
            ```bash
            kubectl set image deployment/mssql-operator \
              operator=ghcr.io/tejasaks/mssql-operator:${{ github.ref_name }} \
              -n mssql-system
            ```

      - name: Summary
        run: |
          echo "## 🚀 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Operator Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-operator.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AG Helper Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta-ag-helper.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "📦 **Draft Release Created**" >> $GITHUB_STEP_SUMMARY
          fi
