---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-operator
  namespace: mssql-system
  labels:
    app.kubernetes.io/name: mssql-operator
    app.kubernetes.io/part-of: mssql-operator
    app: mssql-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mssql-operator
      app: mssql-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mssql-operator
        app.kubernetes.io/part-of: mssql-operator
        app: mssql-operator
    spec:
      serviceAccountName: mssql-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # For local development, use: mssql-operator:dev
          # For production, use: mcr.microsoft.com/mssql/operator:latest
          image: mssql-operator:dev
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
            - containerPort: 9443
              name: webhook
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: "mssql-operator"
            # AG Helper sidecar image configuration
            - name: AG_HELPER_IMAGE
              value: "mssql-ag-helper:dev"
            - name: AG_HELPER_IMAGE_PULL_POLICY
              value: "Never"
            # SQL Exporter image configuration
            - name: SQL_EXPORTER_IMAGE
              value: "burningalchemist/sql_exporter:latest"
      volumes:
        - name: webhook-certs
          emptyDir: {}
      terminationGracePeriodSeconds: 10
