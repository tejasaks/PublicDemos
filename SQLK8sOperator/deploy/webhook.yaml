# Validating Webhook Configuration for MSSQL Operator
# Provides admission control for SQLServer and SQLServerAG resources
#
# TLS certificates are generated automatically by the operator at startup.
# The operator creates a self-signed CA and server certificate, writes them
# to an emptyDir volume, and patches the caBundle field below with the CA cert.
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-operator-webhook
  namespace: mssql-system
  labels:
    app: mssql-operator
    component: webhook
spec:
  ports:
    - port: 443
      targetPort: 9443
      name: webhook
  selector:
    app: mssql-operator

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: mssql-operator-validating-webhook
  labels:
    app: mssql-operator
webhooks:
  - name: validate.sqlserver.mssql.microsoft.com
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    # Timeout for webhook call (fail-open after this)
    timeoutSeconds: 10
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: mssql-operator-webhook
        namespace: mssql-system
        path: /validate-mssql-microsoft-com-v1alpha1-sqlserver
      # caBundle is automatically patched by the operator at startup
      caBundle: ""
    rules:
      - apiGroups: ["mssql.microsoft.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sqlservers"]
        scope: Namespaced
    # Don't validate resources in system namespaces
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]

  - name: validate.sqlserverag.mssql.microsoft.com
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: mssql-operator-webhook
        namespace: mssql-system
        path: /validate-mssql-microsoft-com-v1alpha1-sqlserverag
      # caBundle is automatically patched by the operator at startup
      caBundle: ""
    rules:
      - apiGroups: ["mssql.microsoft.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sqlserverags"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]

# Note: TLS certificates for the webhook are generated automatically by the operator
# at startup using self-signed certificates. No cert-manager or manual certificate
# setup is required. The operator generates a CA + server cert, writes them to an
# emptyDir volume at /tmp/webhook-certs, and patches the ValidatingWebhookConfiguration
# caBundle field above.
