---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mssql-operator
  namespace: mssql-system
  labels:
    app.kubernetes.io/name: mssql-operator
    app.kubernetes.io/part-of: mssql-operator
---
# ServiceAccount for SQL Server pods
# This is created in the mssql namespace where SQL pods run
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mssql-sa
  namespace: mssql
  labels:
    app.kubernetes.io/name: mssql
    app.kubernetes.io/part-of: mssql-operator
