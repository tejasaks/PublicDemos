---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sqlservers.mssql.microsoft.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  labels:
    app.kubernetes.io/name: mssql-operator
    app.kubernetes.io/part-of: mssql-operator
spec:
  group: mssql.microsoft.com
  names:
    kind: SQLServer
    listKind: SQLServerList
    plural: sqlservers
    singular: sqlserver
    shortNames:
      - mssql
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Edition
          type: string
          jsonPath: .spec.edition
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: SQLServer is the Schema for the sqlservers API
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 13
                  pattern: "^[a-z][a-z0-9-]*$"
                  description: "Name must be max 13 chars (SQL Server hostname limit is 15, minus 2 for pod suffix)"
            spec:
              description: SQLServerSpec defines the desired state of SQLServer
              type: object
              required:
                - credentials
                - instance
              properties:
                description:
                  description: Human-readable description of this SQL Server instance for identification and auditing
                  type: string
                  maxLength: 256
                version:
                  description: SQL Server version (2019, 2022, 2025)
                  type: string
                  enum: ["2019", "2022", "2025"]
                  default: "2022"
                edition:
                  description: SQL Server edition
                  type: string
                  enum: [Developer, Express, Standard, Enterprise]
                  default: Developer
                instance:
                  description: Instance configuration
                  type: object
                  required:
                    - storage
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 9
                      default: 1
                    image:
                      type: string
                    imagePullPolicy:
                      type: string
                      enum: [Always, Never, IfNotPresent]
                      default: IfNotPresent
                    imagePullSecrets:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                    resources:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    storage:
                      type: object
                      required:
                        - data
                      properties:
                        data:
                          type: object
                          required:
                            - size
                          properties:
                            size:
                              type: string
                            storageClass:
                              type: string
                            accessMode:
                              type: string
                              default: ReadWriteOnce
                        log:
                          type: object
                          properties:
                            size:
                              type: string
                            storageClass:
                              type: string
                        tempdb:
                          type: object
                          properties:
                            size:
                              type: string
                            storageClass:
                              type: string
                        backup:
                          type: object
                          properties:
                            size:
                              type: string
                            storageClass:
                              type: string
                    config:
                      type: object
                      properties:
                        agentEnabled:
                          type: boolean
                          default: true
                        hadrEnabled:
                          type: boolean
                          default: true
                        memoryLimitMB:
                          type: integer
                        collation:
                          type: string
                          default: SQL_Latin1_General_CP1_CI_AS
                        lcid:
                          type: integer
                          default: 1033
                        traceFlags:
                          type: array
                          items:
                            type: integer
                        tlsEnabled:
                          type: boolean
                          default: false
                        customMSSQLConf:
                          type: string
                    nodeSelector:
                      type: object
                      additionalProperties:
                        type: string
                    tolerations:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    affinity:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    priorityClassName:
                      type: string
                credentials:
                  description: Authentication configuration
                  type: object
                  required:
                    - saPasswordSecretRef
                  properties:
                    saPasswordSecretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                          default: password
                activeDirectory:
                  description: Active Directory authentication configuration
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    realm:
                      type: string
                    domainControllers:
                      type: array
                      items:
                        type: string
                    serviceAccountSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                    spnPrefix:
                      type: string
                      default: MSSQLSvc
                    keytabSecretRef:
                      type: object
                      properties:
                        name:
                          type: string
                    adminGroup:
                      type: string
                    netBIOSDomain:
                      type: string
                    dnsSuffix:
                      type: string
                service:
                  description: Service configuration
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [ClusterIP, NodePort, LoadBalancer]
                      default: ClusterIP
                    port:
                      type: integer
                      default: 1433
                    nodePort:
                      type: integer
                    loadBalancerIP:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                monitoring:
                  description: Monitoring configuration
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    exporterImage:
                      type: string
                      default: burningalchemist/sql_exporter:latest
                    exporterPort:
                      type: integer
                      default: 9399
                    customQueries:
                      type: string
                metadata:
                  description: Labels and annotations to propagate
                  type: object
                  properties:
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                shutdown:
                  description: Shutdown the cluster
                  type: boolean
            status:
              description: SQLServerStatus defines the observed state
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Creating, Running, Failed, Upgrading, Terminating]
                ready:
                  type: boolean
                currentVersion:
                  type: string
                currentImage:
                  type: string
                instances:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      role:
                        type: string
                      ready:
                        type: boolean
                      podIP:
                        type: string
                      node:
                        type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
                  format: int64
