---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: operatorconfigurations.mssql.microsoft.com
spec:
  group: mssql.microsoft.com
  names:
    kind: OperatorConfiguration
    listKind: OperatorConfigurationList
    plural: operatorconfigurations
    shortNames:
    - mssqlconfig
    singular: operatorconfiguration
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dockerImage
      name: Docker-Image
      type: string
    - jsonPath: .spec.workers
      name: Workers
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: OperatorConfiguration is the Schema for the operator configuration
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OperatorConfigurationSpec defines the configuration for the
              MSSQL Operator
            properties:
              activeDirectory:
                description: ActiveDirectory contains AD defaults
                properties:
                  adutilImage:
                    description: AdutilImage is the image for adutil operations
                    type: string
                  defaultSPNPrefix:
                    default: MSSQLSvc
                    description: DefaultSPNPrefix is the default SPN prefix
                    type: string
                type: object
              dockerImage:
                default: mcr.microsoft.com/mssql/server:2022-latest
                description: 'DockerImage is the default SQL Server image (DEPRECATED:
                  use images.sql2022 instead)'
                type: string
              images:
                description: |-
                  Images contains container image configuration for all components
                  This is the recommended way to configure custom images for SQL Server,
                  AG Helper, and SQL Exporter across the entire cluster
                properties:
                  agHelper:
                    default: mssql-ag-helper:latest
                    description: AGHelper is the container image for the AG Helper
                      sidecar
                    type: string
                  defaultPullPolicy:
                    default: IfNotPresent
                    description: DefaultPullPolicy is the default image pull policy
                      for all containers
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    type: string
                  imagePullSecrets:
                    description: |-
                      ImagePullSecrets is a list of secret names for authenticating to private registries
                      These secrets will be added to all pods created by the operator
                    items:
                      type: string
                    type: array
                  sql2019:
                    default: mcr.microsoft.com/mssql/server:2019-latest
                    description: SQL2019 is the container image for SQL Server 2019
                    type: string
                  sql2022:
                    default: mcr.microsoft.com/mssql/server:2022-latest
                    description: SQL2022 is the container image for SQL Server 2022
                    type: string
                  sql2025:
                    default: mcr.microsoft.com/mssql/server:2025-latest
                    description: SQL2025 is the container image for SQL Server 2025
                    type: string
                  sqlExporter:
                    default: burningalchemist/sql_exporter:latest
                    description: SQLExporter is the container image for the SQL Exporter
                      (Prometheus metrics)
                    type: string
                type: object
              kubernetes:
                description: Kubernetes contains Kubernetes-specific settings
                properties:
                  clusterNameLabel:
                    default: mssql.microsoft.com/cluster
                    description: ClusterNameLabel is the label used to identify clusters
                    type: string
                  enablePVCDeletion:
                    default: false
                    description: EnablePVCDeletion allows deletion of PVCs when cluster
                      is deleted
                    type: boolean
                  enablePodDisruptionBudget:
                    default: true
                    description: EnablePodDisruptionBudget enables PDB creation
                    type: boolean
                  enableSecretsDeletion:
                    default: true
                    description: EnableSecretsDeletion allows deletion of secrets
                      when cluster is deleted
                    type: boolean
                  inheritedAnnotations:
                    description: InheritedAnnotations are annotations from SQLServer
                      CR to propagate
                    items:
                      type: string
                    type: array
                  inheritedLabels:
                    description: InheritedLabels are labels from SQLServer CR to propagate
                      to child resources
                    items:
                      type: string
                    type: array
                  podAntiAffinity:
                    description: PodAntiAffinity configures pod anti-affinity for
                      HA
                    properties:
                      enabled:
                        default: true
                        description: Enabled enables pod anti-affinity
                        type: boolean
                      preferredDuringScheduling:
                        default: false
                        description: PreferredDuringScheduling uses preferred instead
                          of required affinity
                        type: boolean
                      topologyKey:
                        default: kubernetes.io/hostname
                        description: TopologyKey for anti-affinity
                        type: string
                    type: object
                  podManagementPolicy:
                    default: OrderedReady
                    description: PodManagementPolicy for StatefulSets
                    enum:
                    - OrderedReady
                    - Parallel
                    type: string
                  podServiceAccountName:
                    default: mssql-sa
                    description: PodServiceAccountName is the service account for
                      SQL Server pods
                    type: string
                  watchedNamespace:
                    description: WatchedNamespace limits the operator to a specific
                      namespace (empty = all)
                    type: string
                type: object
              monitoring:
                description: Monitoring contains monitoring defaults
                properties:
                  enablePrometheusServiceMonitor:
                    default: true
                    description: EnablePrometheusServiceMonitor creates ServiceMonitor
                      resources
                    type: boolean
                  exporterImage:
                    default: burningalchemist/sql_exporter:latest
                    description: ExporterImage is the default exporter image
                    type: string
                  scrapeInterval:
                    default: 15s
                    description: ScrapeInterval for Prometheus
                    type: string
                type: object
              repairPeriod:
                default: 5m
                description: RepairPeriod is the interval for repair checks
                type: string
              resourceDefaults:
                description: ResourceDefaults contains default resource configurations
                properties:
                  defaultCPULimit:
                    default: "4"
                    description: DefaultCPULimit is the default CPU limit
                    type: string
                  defaultCPURequest:
                    default: "1"
                    description: DefaultCPURequest is the default CPU request
                    type: string
                  defaultMemoryLimit:
                    default: 8Gi
                    description: DefaultMemoryLimit is the default memory limit
                    type: string
                  defaultMemoryRequest:
                    default: 2Gi
                    description: DefaultMemoryRequest is the default memory request
                    type: string
                  maxInstances:
                    default: 9
                    description: MaxInstances is the maximum allowed instances
                    format: int32
                    type: integer
                  minInstances:
                    default: 1
                    description: MinInstances is the minimum allowed instances
                    format: int32
                    type: integer
                type: object
              resyncPeriod:
                default: 30m
                description: ResyncPeriod is the interval for full resync of all clusters
                type: string
              sidecarImage:
                default: mssql-ag-helper:latest
                description: 'SidecarImage is the default AG helper sidecar image
                  (DEPRECATED: use images.agHelper instead)'
                type: string
              timeouts:
                description: Timeouts contains various timeout configurations
                properties:
                  podDeletionWaitTimeout:
                    default: 10m
                    description: PodDeletionWaitTimeout is how long to wait for pod
                      deletion
                    type: string
                  readyWaitInterval:
                    default: 4s
                    description: ReadyWaitInterval is the interval for readiness checks
                    type: string
                  readyWaitTimeout:
                    default: 30s
                    description: ReadyWaitTimeout is the timeout for readiness
                    type: string
                  resourceCheckInterval:
                    default: 3s
                    description: ResourceCheckInterval is the interval between resource
                      checks
                    type: string
                  resourceCheckTimeout:
                    default: 10m
                    description: ResourceCheckTimeout is the timeout for resource
                      checks
                    type: string
                type: object
              validation:
                description: Validation contains validation behavior configuration
                properties:
                  clusterCapabilityChecks:
                    default: true
                    description: ClusterCapabilityChecks enables validation of cluster
                      capabilities (StorageClass, etc.)
                    type: boolean
                  nodeValidation:
                    default: block
                    description: NodeValidation controls node selector validation
                    enum:
                    - block
                    - warn
                    type: string
                  passwordComplexity:
                    default: enforce
                    description: PasswordComplexity controls password complexity validation
                    enum:
                    - enforce
                    - warn
                    type: string
                  secretValidation:
                    default: warn
                    description: SecretValidation controls how Secret validation failures
                      are handled
                    enum:
                    - block
                    - warn
                    type: string
                  storageClassValidation:
                    default: block
                    description: StorageClassValidation controls how StorageClass
                      validation failures are handled
                    enum:
                    - block
                    - warn
                    type: string
                  validationTimeout:
                    default: 3s
                    description: ValidationTimeout is the maximum time to wait for
                      cluster capability checks
                    type: string
                type: object
              workers:
                default: 8
                description: Workers is the number of concurrent reconciliation workers
                format: int32
                maximum: 32
                minimum: 1
                type: integer
            type: object
          status:
            description: OperatorConfigurationStatus defines the observed state
            properties:
              conditions:
                description: Conditions represent the latest observations
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentConfiguration:
                description: CurrentConfiguration shows the active configuration
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
