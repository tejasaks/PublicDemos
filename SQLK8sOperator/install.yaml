                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              currentImage:
                description: CurrentImage is the current container image
                type: string
              currentVersion:
                description: CurrentVersion is the current SQL Server version
                type: string
              instances:
                description: Instances contains status of each SQL Server instance
                items:
                  description: InstanceStatus represents the status of a single SQL
                    Server instance
                  properties:
                    name:
                      description: Name is the pod name
                      type: string
                    node:
                      description: Node is the name of the node running this instance
                      type: string
                    podIP:
                      description: PodIP is the IP address of the pod
                      type: string
                    ready:
                      description: Ready indicates if this instance is ready
                      type: boolean
                    role:
                      description: Role is Primary or Secondary (for AG configurations)
                      enum:
                      - Primary
                      - Secondary
                      - Resolving
                      - NotApplicable
                      type: string
                  required:
                  - name
                  - ready
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                format: int64
                type: integer
              phase:
                description: Phase represents the current lifecycle phase
                enum:
                - Pending
                - Creating
                - Running
                - Failed
                - Upgrading
                - Terminating
                type: string
              ready:
                description: Ready indicates if the SQL Server instance is ready to
                  accept connections
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

# -----------------------------------------------------------------------------
# Webhook Configuration
# Source: deploy\webhook.yaml
# -----------------------------------------------------------------------------
# Validating Webhook Configuration for MSSQL Operator
# Provides admission control for SQLServer and SQLServerAG resources
#
# TLS Certificate Modes (set WEBHOOK_CERT_MODE env var in the Deployment):
#
#   "self-signed" (default):
#     Generates a self-signed CA + server certificate at operator startup.
#     The caBundle below is patched automatically. No external setup required.
#
#   "manual":
#     Load certs from a pre-created TLS secret (WEBHOOK_TLS_SECRET_NAME).
#     Create it with:
#       kubectl create secret tls mssql-operator-webhook-tls \
#         --cert=tls.crt --key=tls.key -n mssql-system
#     Optionally add ca.crt for automatic caBundle patching:
#       kubectl create secret generic mssql-operator-webhook-tls \
#         --from-file=tls.crt --from-file=tls.key --from-file=ca.crt -n mssql-system
#     To rotate: update the secret and restart the operator pod.
#
#   "cert-manager":
#     Relies on cert-manager to populate the TLS secret and inject caBundle
#     via the cert-manager.io/inject-ca-from annotation below. Uncomment
#     the annotation and configure a Certificate + Issuer resource.
#
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-operator-webhook
  namespace: mssql-system
  labels:
    app: mssql-operator
    component: webhook
spec:
  ports:
    - port: 443
      targetPort: 9443
      name: webhook
  selector:
    app: mssql-operator

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: mssql-operator-validating-webhook
  labels:
    app: mssql-operator
  # Uncomment for cert-manager mode to let cert-manager inject caBundle:
  # annotations:
  #   cert-manager.io/inject-ca-from: mssql-system/mssql-operator-webhook-cert
webhooks:
  - name: validate.sqlserver.mssql.microsoft.com
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    # Timeout for webhook call (fail-open after this)
    timeoutSeconds: 10
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: mssql-operator-webhook
        namespace: mssql-system
        path: /validate-mssql-microsoft-com-v1alpha1-sqlserver
      # caBundle is automatically patched by the operator at startup
      caBundle: ""
    rules:
      - apiGroups: ["mssql.microsoft.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sqlservers"]
        scope: Namespaced
    # Don't validate resources in system namespaces
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]

  - name: validate.sqlserverag.mssql.microsoft.com
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service:
        name: mssql-operator-webhook
        namespace: mssql-system
        path: /validate-mssql-microsoft-com-v1alpha1-sqlserverag
      # caBundle is automatically patched by the operator at startup
      caBundle: ""
    rules:
      - apiGroups: ["mssql.microsoft.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sqlserverags"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-public", "kube-node-lease"]

# For cert-manager mode, uncomment and configure the Certificate + Issuer:
#
# ---
# apiVersion: cert-manager.io/v1
# kind: Certificate
# metadata:
#   name: mssql-operator-webhook-cert
#   namespace: mssql-system
# spec:
#   secretName: mssql-operator-webhook-tls
#   dnsNames:
#     - mssql-operator-webhook.mssql-system.svc
#     - mssql-operator-webhook.mssql-system.svc.cluster.local
#   issuerRef:
#     name: mssql-operator-selfsigned-issuer
#     kind: Issuer
#
# ---
# apiVersion: cert-manager.io/v1
# kind: Issuer
# metadata:
#   name: mssql-operator-selfsigned-issuer
#   namespace: mssql-system
# spec:
#   selfSigned: {}

# -----------------------------------------------------------------------------
# Operator Deployment
# Source: deploy/deployment.yaml
# -----------------------------------------------------------------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql-operator
  namespace: mssql-system
  labels:
    app.kubernetes.io/name: mssql-operator
    app.kubernetes.io/part-of: mssql-operator
    app: mssql-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mssql-operator
      app: mssql-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mssql-operator
        app.kubernetes.io/part-of: mssql-operator
        app: mssql-operator
    spec:
      serviceAccountName: mssql-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # For local development, use: mssql-operator:dev
          # For production, use: mcr.microsoft.com/mssql/operator:latest
          image: ghcr.io/tejasaks/mssql-operator:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
            - containerPort: 9443
              name: webhook
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_NAME
              value: "mssql-operator"
            # --- Webhook TLS Certificate Mode ---
            # Controls how webhook TLS certificates are provisioned:
            #   "self-signed" (default) - auto-generate at startup (no secret needed)
            #   "manual"                - load from WEBHOOK_TLS_SECRET_NAME secret
            #   "cert-manager"          - load from cert-manager-managed secret
            - name: WEBHOOK_CERT_MODE
              value: "self-signed"
            # Name of the TLS secret for "manual" or "cert-manager" modes.
            # Ignored when WEBHOOK_CERT_MODE=self-signed.
            # - name: WEBHOOK_TLS_SECRET_NAME
            #   value: "mssql-operator-webhook-tls"
            # AG Helper sidecar image configuration
            - name: AG_HELPER_IMAGE
              value: "ghcr.io/tejasaks/mssql-ag-helper:v1.0.0"
            - name: AG_HELPER_IMAGE_PULL_POLICY
              value: "IfNotPresent"
            # SQL Exporter image configuration
            - name: SQL_EXPORTER_IMAGE
              value: "burningalchemist/sql_exporter:latest"
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/webhook-certs
      volumes:
        - name: webhook-certs
          emptyDir: {}
      terminationGracePeriodSeconds: 10


# ==============================================================================
# End of install.yaml
# ==============================================================================
