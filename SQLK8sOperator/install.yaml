---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: sqlserverags.mssql.microsoft.com
spec:
  group: mssql.microsoft.com
  names:
    kind: SQLServerAG
    listKind: SQLServerAGList
    plural: sqlserverags
    shortNames:
    - mssqlag
    singular: sqlserverag
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.availabilityGroup.name
      name: AG-Name
      type: string
    - jsonPath: .spec.availabilityGroup.instanceCount
      name: Instances
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.primaryReplica
      name: Primary
      type: string
    - jsonPath: .status.synchronizedInstances
      name: Synced
      type: integer
    - jsonPath: .status.listener.phase
      name: Listener
      priority: 1
      type: string
    - jsonPath: .status.listener.vip
      name: VIP
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SQLServerAG is the Schema for the sqlserverags API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SQLServerAGSpec defines the desired state of SQLServerAG
              (Availability Group)
            properties:
              availabilityGroup:
                description: AvailabilityGroup contains the AG configuration
                properties:
                  automaticFailover:
                    default: false
                    description: |-
                      AutomaticFailover enables controller-driven automatic failover when primary is lost
                      When false (default), the operator only monitors AG health; failover requires manual intervention
                      When true, the controller will detect primary failure and promote a secondary automatically
                    type: boolean
                  clusterType:
                    default: External
                    description: ClusterType is always External for Kubernetes
                    enum:
                    - External
                    type: string
                  databases:
                    description: Databases is the list of databases to include in
                      the AG
                    items:
                      description: AGDatabase defines a database to include in the
                        AG
                      properties:
                        backupPath:
                          description: BackupPath is the path for initial backup (for
                            manual seeding)
                          type: string
                        name:
                          description: Name is the database name
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  dbFailover:
                    default: true
                    description: DBFailover enables automatic failover based on database
                      health
                    type: boolean
                  endpointPort:
                    default: 5022
                    description: EndpointPort is the port for the database mirroring
                      endpoint
                    format: int32
                    type: integer
                  externalWriteLeaseValidity:
                    default: 20s
                    description: ExternalWriteLeaseValidity is the duration for the
                      external write lease (SQL 2019+)
                    type: string
                  healthCheckCredentials:
                    description: |-
                      HealthCheckCredentials defines the SQL login credentials for AG health monitoring
                      This is the default for all instances; individual instances can override
                    properties:
                      password:
                        description: |-
                          Password is the SQL login password (plain text - NOT RECOMMENDED for production)
                          Use secretRef instead for production deployments
                          WARNING: Plain text passwords in manifests are a security risk
                        type: string
                      secretRef:
                        description: SecretRef references a Kubernetes secret containing
                          the credentials
                        properties:
                          passwordSecret:
                            description: PasswordSecret references the secret containing
                              the SQL password
                            properties:
                              key:
                                default: password
                                description: Key is the key within the secret
                                type: string
                              name:
                                description: Name is the name of the secret
                                type: string
                            required:
                            - name
                            type: object
                          usernameSecret:
                            description: UsernameSecret references the secret containing
                              the SQL username
                            properties:
                              key:
                                default: password
                                description: Key is the key within the secret
                                type: string
                              name:
                                description: Name is the name of the secret
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - passwordSecret
                        - usernameSecret
                        type: object
                      username:
                        description: |-
                          Username is the SQL login username (plain text - NOT RECOMMENDED for production)
                          Use secretRef instead for production deployments
                        type: string
                    type: object
                  instanceCount:
                    default: 3
                    description: |-
                      InstanceCount is the number of SQL Server instances participating in the AG (typically 2-5)
                      Note: These are independent instances, not replicas. Each has its own identity and storage.
                    format: int32
                    maximum: 9
                    minimum: 2
                    type: integer
                  instanceCredentials:
                    additionalProperties:
                      description: |-
                        HealthCheckCredentialsSpec defines credentials for AG Helper health monitoring
                        The AG Helper uses these credentials to connect to SQL Server instead of the SA account
                        This follows the SQL Server Pacemaker pattern for least-privilege health checking
                      properties:
                        password:
                          description: |-
                            Password is the SQL login password (plain text - NOT RECOMMENDED for production)
                            Use secretRef instead for production deployments
                            WARNING: Plain text passwords in manifests are a security risk
                          type: string
                        secretRef:
                          description: SecretRef references a Kubernetes secret containing
                            the credentials
                          properties:
                            passwordSecret:
                              description: PasswordSecret references the secret containing
                                the SQL password
                              properties:
                                key:
                                  default: password
                                  description: Key is the key within the secret
                                  type: string
                                name:
                                  description: Name is the name of the secret
                                  type: string
                              required:
                              - name
                              type: object
                            usernameSecret:
                              description: UsernameSecret references the secret containing
                                the SQL username
                              properties:
                                key:
                                  default: password
                                  description: Key is the key within the secret
                                  type: string
                                name:
                                  description: Name is the name of the secret
                                  type: string
                              required:
                              - name
                              type: object
                          required:
                          - passwordSecret
                          - usernameSecret
                          type: object
                        username:
                          description: |-
                            Username is the SQL login username (plain text - NOT RECOMMENDED for production)
                            Use secretRef instead for production deployments
                          type: string
                      type: object
                    description: |-
                      InstanceCredentials allows per-instance credential overrides
                      Key is the instance index (0, 1, 2, etc.)
                    type: object
                  name:
                    description: |-
                      Name is the name of the Availability Group (required)
                      Each SQLServerAG resource monitors exactly one AG
                    maxLength: 128
                    minLength: 1
                    type: string
                  primaryConfig:
                    description: PrimaryConfig defines the primary instance configuration
                    properties:
                      availabilityMode:
                        default: SynchronousCommit
                        description: AvailabilityMode defines the synchronization
                          mode
                        enum:
                        - SynchronousCommit
                        - AsynchronousCommit
                        type: string
                      failoverMode:
                        default: External
                        description: FailoverMode is always External for Kubernetes-managed
                          AG
                        enum:
                        - External
                        type: string
                      readableSecondary:
                        default: ReadOnly
                        description: ReadableSecondary defines read access to secondary
                          instances
                        enum:
                        - "No"
                        - ReadOnly
                        - All
                        type: string
                      sessionTimeout:
                        default: 10
                        description: SessionTimeout in seconds
                        format: int32
                        type: integer
                    type: object
                  secondaryConfig:
                    description: SecondaryConfig defines the secondary instances configuration
                    properties:
                      availabilityMode:
                        default: SynchronousCommit
                        description: AvailabilityMode defines the synchronization
                          mode
                        enum:
                        - SynchronousCommit
                        - AsynchronousCommit
                        type: string
                      failoverMode:
                        default: External
                        description: FailoverMode is always External for Kubernetes-managed
                          AG
                        enum:
                        - External
                        type: string
                      readableSecondary:
                        default: ReadOnly
                        description: ReadableSecondary defines read access to secondary
                          instances
                        enum:
                        - "No"
                        - ReadOnly
                        - All
                        type: string
                      sessionTimeout:
                        default: 10
                        description: SessionTimeout in seconds
                        format: int32
                        type: integer
                    type: object
                  seedingMode:
                    default: Automatic
                    description: SeedingMode defines how databases are seeded to secondaries
                    enum:
                    - Automatic
                    - Manual
                    type: string
                required:
                - healthCheckCredentials
                - name
                - primaryConfig
                - secondaryConfig
                type: object
              description:
                description: Description is an optional human-readable description
                  for auditing and searchability
                maxLength: 1024
                type: string
              failover:
                description: Failover contains failover behavior configuration
                properties:
                  automatic:
                    default: true
                    description: Automatic enables automatic failover
                    type: boolean
                  dataLossThreshold:
                    default: 0
                    description: DataLossThreshold defines acceptable data loss (0
                      = no data loss)
                    format: int32
                    type: integer
                  healthCheckTimeout:
                    default: 30s
                    description: HealthCheckTimeout is the timeout for health checks
                    type: string
                  leaseTimeout:
                    default: 60s
                    description: LeaseTimeout is the primary write lease duration
                    type: string
                  requiredSynchronizedSecondaries:
                    default: -1
                    description: |-
                      RequiredSynchronizedSecondaries is the minimum number of synchronized secondaries
                      required before committing on the primary (-1 for auto-calculate)
                    format: int32
                    type: integer
                type: object
              listener:
                description: |-
                  Listener configures the Kubernetes Service for AG listener access
                  This creates a VIP (ClusterIP) that the operator manages to point to the primary replica
                properties:
                  annotations:
                    additionalProperties:
                      type: string
