# =============================================================================
# GitHub Actions Workflow: Build and Push Operator Image
# =============================================================================
# 
# This workflow builds and pushes the SQL Server Kubernetes Operator image
# to GitHub Container Registry (ghcr.io).
#
# TRIGGERS:
#   - Push to main branch (when SQLK8sOperator files change)
#   - Git tag push (v*.*.*)
#   - Manual trigger (workflow_dispatch)
#
# IMAGE TAGS:
#   - On main push: latest, main, sha-<commit>
#   - On tag push: v1.0.0, latest (if not pre-release)
#
# USAGE:
#   Place this file at: PublicDemos/.github/workflows/build-operator.yaml
#
# =============================================================================

name: Build and Push Operator Image

on:
  push:
    branches:
      - main
    paths:
      - 'SQLK8sOperator/**'
      - '.github/workflows/build-operator.yaml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v1.0.0). Leave empty for dev build.'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tejasaks/mssql-operator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # For creating releases
      packages: write  # For pushing to ghcr.io

    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push - use the tag name
            VERSION="${{ github.ref_name }}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            # Manual trigger with version
            VERSION="${{ github.event.inputs.version }}"
          else
            # Main branch push - use commit SHA
            VERSION="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: SQLK8sOperator/go.sum

      - name: Run tests
        working-directory: SQLK8sOperator
        run: |
          go mod download
          go test ./... -v -short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For tag pushes (releases), use the tag
            type=ref,event=tag
            # For main branch, add 'latest' and 'main'
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            # Always add short SHA
            type=sha,prefix=sha-,format=short
            # Add v1.0.0 for main branch (for install.yaml compatibility)
            type=raw,value=v1.0.0,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./SQLK8sOperator
          file: ./SQLK8sOperator/Dockerfile.operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release (on tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          generate_release_notes: true
          body: |
            ## SQL Server Kubernetes Operator ${{ github.ref_name }}
            
            ### Installation
            
            ```bash
            kubectl apply -f https://raw.githubusercontent.com/tejasaks/PublicDemos/${{ github.ref_name }}/SQLK8sOperator/install.yaml
            ```
            
            ### Docker Image
            
            ```
            ghcr.io/tejasaks/mssql-operator:${{ github.ref_name }}
            ```
            
            ### Upgrade
            
            ```bash
            kubectl set image deployment/mssql-operator \
              operator=ghcr.io/tejasaks/mssql-operator:${{ github.ref_name }} \
              -n mssql-system
            ```

      - name: Summary
        run: |
          echo "## 🚀 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "📦 **Draft Release Created:** Review and publish at [Releases](https://github.com/tejasaks/PublicDemos/releases)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Dev Build:** To create a release, push a git tag (e.g., \`git tag v1.0.0 && git push origin v1.0.0\`)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### User Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "kubectl apply -f https://raw.githubusercontent.com/tejasaks/PublicDemos/main/SQLK8sOperator/install.yaml" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
