# ============================================================================
# STEP 1: Deploy SQL Server Replicas for Availability Group
# ============================================================================
#
# This manifest deploys SQL Server replicas configured for Availability Groups.
# The AG Helper sidecar will be deployed in Step 3 (ag-step3-ag-config.yaml).
#
# DEPLOYMENT ORDER:
#   1. Apply this file (creates SQL replicas with hadrEnabled=true)
#   2. Wait for all pods to be Running and Ready
#   3. Execute T-SQL steps from ag-step2-setup-ag.md
#   4. Apply ag-step3-ag-config.yaml (deploys AG Helper + K8s services)
#
# WHAT THIS CREATES:
#   - mssql namespace
#   - SQLServer CR with 3 replicas (hadrEnabled=true)
#   - SA password secret
#   - AG Helper credentials secret (for use in Step 3)
#
# NEXT STEP: After pods are Running, follow ag-step2-setup-ag.md
# ============================================================================

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: mssql

---
# SA password secret
# SECURITY: Change this password in production!
apiVersion: v1
kind: Secret
metadata:
  name: sql-ag-sa
  namespace: mssql
  labels:
    app.kubernetes.io/component: mssql
type: Opaque
stringData:
  password: "YourStrong@Passw0rd!"  # CHANGE THIS!

---
# AG Helper credentials secret
# This login will be created in SQL Server during Step 2 (T-SQL setup)
# Required permissions: VIEW SERVER STATE, ALTER ANY AVAILABILITY GROUP
apiVersion: v1
kind: Secret
metadata:
  name: sql-ag-helper
  namespace: mssql
  labels:
    app.kubernetes.io/component: ag-helper
type: Opaque
stringData:
  username: "ag_helper"
  password: "AGHelper@Passw0rd!"  # CHANGE THIS! Must match T-SQL in Step 2

---
# SQL Server with 3 replicas for AG
apiVersion: mssql.microsoft.com/v1alpha1
kind: SQLServer
metadata:
  name: sql-ag
  namespace: mssql
spec:
  description: "SQL Server AG cluster - Step 1: Replicas only"
  
  version: "2025"
  edition: Developer  # Use Enterprise for production
  
  instance:
    # 3 replicas for the AG
    replicas: 3
    
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "2"
        memory: 4Gi
    
    storage:
      data:
        size: 50Gi
        # storageClass: managed-premium  # Uncomment for Azure
      log:
        size: 20Gi
      backup:
        size: 50Gi
    
    config:
      hadrEnabled: true   # Required for AG
      agentEnabled: true
      collation: SQL_Latin1_General_CP1_CI_AS
    
    # Distribute pods across nodes for HA
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: mssql
                  mssql.microsoft.com/instance: sql-ag
              topologyKey: kubernetes.io/hostname
  
  credentials:
    saPasswordSecretRef:
      name: sql-ag-sa
      key: password
  
  service:
    type: LoadBalancer
    port: 1433

---
# ============================================================================
# INDIVIDUAL REPLICA SERVICES
# ============================================================================
# These services provide direct access to each SQL Server replica individually.
# This is required for:
#   - T-SQL AG setup (connecting to each replica separately)
#   - AG endpoint communication between replicas (port 5022)
#   - Managing standalone databases on specific replicas
#   - Direct replica access for troubleshooting
#
# Service naming pattern: <sqlserver-name>-<ordinal>
#   sql-ag-0 -> connects to pod sql-ag-0
#   sql-ag-1 -> connects to pod sql-ag-1
#   sql-ag-2 -> connects to pod sql-ag-2
#
# DNS names for AG endpoint URLs:
#   sql-ag-0.mssql.svc.cluster.local:5022
#   sql-ag-1.mssql.svc.cluster.local:5022
#   sql-ag-2.mssql.svc.cluster.local:5022
# ============================================================================

---
# Service for replica 0
apiVersion: v1
kind: Service
metadata:
  name: sql-ag-0
  namespace: mssql
  labels:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    mssql.microsoft.com/replica: "0"
spec:
  type: LoadBalancer
  selector:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    statefulset.kubernetes.io/pod-name: sql-ag-0
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
    - name: ag-endpoint
      port: 5022
      targetPort: 5022

---
# Service for replica 1
apiVersion: v1
kind: Service
metadata:
  name: sql-ag-1
  namespace: mssql
  labels:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    mssql.microsoft.com/replica: "1"
spec:
  type: LoadBalancer
  selector:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    statefulset.kubernetes.io/pod-name: sql-ag-1
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
    - name: ag-endpoint
      port: 5022
      targetPort: 5022

---
# Service for replica 2
apiVersion: v1
kind: Service
metadata:
  name: sql-ag-2
  namespace: mssql
  labels:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    mssql.microsoft.com/replica: "2"
spec:
  type: LoadBalancer
  selector:
    app: mssql
    mssql.microsoft.com/instance: sql-ag
    statefulset.kubernetes.io/pod-name: sql-ag-2
  ports:
    - name: sql
      port: 1433
      targetPort: 1433
    - name: ag-endpoint
      port: 5022
      targetPort: 5022

# ============================================================================
# NOTE ON AG HELPER DEPLOYMENT
# ============================================================================
# The AG Helper sidecar is deployed when you create a SQLServerAG resource
# (Step 3). The AG Helper monitors the specific AG named in the SQLServerAG
# resource.
#
# For Step 1, we only deploy the SQL Server replicas. The AG Helper will be
# added when you apply ag-step3-ag-config.yaml.
#
# IMPORTANT: The AG must exist in SQL Server (via T-SQL in Step 2) before
# the AG Helper can monitor it. Complete Step 2 before applying Step 3.
# ============================================================================

# ============================================================================
# NEXT STEPS
# ============================================================================
#
# 1. Apply this manifest:
#    kubectl apply -f ag-step1-replicas.yaml
#
# 2. Wait for all pods to be Running:
#    kubectl get pods -n mssql -w
#    # Wait until all 3 pods show 1/1 Ready (no AG Helper sidecar yet)
#
# 3. Verify all services are created:
#    kubectl get svc -n mssql
#    # Should see:
#    #   sql-ag           LoadBalancer (shared service - ANY pod)
#    #   sql-ag-headless  ClusterIP    (StatefulSet DNS)
#    #   sql-ag-0         LoadBalancer (replica 0 only)
#    #   sql-ag-1         LoadBalancer (replica 1 only)
#    #   sql-ag-2         LoadBalancer (replica 2 only)
#
# 4. Get external IPs for each replica (for minikube: run 'minikube tunnel'):
#    kubectl get svc -n mssql -l mssql.microsoft.com/instance=sql-ag
#
# 5. Follow T-SQL steps in ag-step2-setup-ag.md to:
#    - Create AG Helper login on all replicas
#    - Create certificates and endpoints
#    - Create the Availability Group
#    - Join secondary replicas
#
# 6. Apply ag-step3-ag-config.yaml to:
#    - Deploy AG Helper sidecar (monitors the specified AG)
#    - Create Primary/Secondary LoadBalancer services
#    - Enable health monitoring (automatic failover optional)
#
# 7. Verify AG Helper is monitoring the AG:
#    kubectl logs sql-ag-0 -n mssql -c ag-helper
#    # Expected: "AG 'ProductionAG' State: role=PRIMARY, sync=SYNCHRONIZED, health=Healthy"
#
# ============================================================================
