# AG Helper Credentials Secret Example
# =====================================
# This file is a REFERENCE TEMPLATE for creating AG Helper credentials.
# It is NOT automatically applied when deploying the AG samples.
#
# USE THIS FILE WHEN:
# - You want to pre-create secrets BEFORE deploying the AG manifests
# - You're using GitOps and want to manage secrets separately
# - You want to customize secret names or use different credentials per replica
#
# WORKFLOW OPTIONS:
# 
# Option A: Quick Dev/Test (secrets included in AG manifests)
#   1. Simply apply the AG sample manifest (sqlserver-availability-group.yaml)
#   2. Secrets are created automatically as part of the manifest
#   3. No need to use this file
#
# Option B: Production (pre-create secrets)
#   1. Copy and customize this file with your credentials
#   2. Apply this file: kubectl apply -f ag-helper-credentials-secret.yaml
#   3. Apply the AG manifest WITHOUT the secrets section (comment it out)
#   4. Ensure healthCheckCredentials.secretRef points to the correct secret name
#
# This secret contains credentials for the AG Helper sidecar to connect
# to SQL Server for health monitoring. Uses a dedicated least-privilege
# SQL login following the Pacemaker pattern from Microsoft's documentation.
#
# IMPORTANT: You must create the SQL login on ALL AG replicas before deploying
# the SQLServerAG resource. See the T-SQL commands below.
#
# For production:
# - Generate a strong password (min 16 chars with complexity)
# - Consider using Azure Key Vault or external secrets operator
# - Rotate credentials periodically
#
# Reference: https://learn.microsoft.com/en-us/sql/linux/sql-server-linux-availability-group-cluster-pacemaker

apiVersion: v1
kind: Secret
metadata:
  name: sql-ag-aghelper
  namespace: mssql
  labels:
    app.kubernetes.io/component: ag-helper
    app.kubernetes.io/part-of: mssql-operator
type: Opaque
stringData:
  # SQL login username (recommend: ag_helper)
  username: "ag_helper"
  # SQL login password (use a strong password in production)
  password: "AGHelper@Passw0rd!"

---
# ===========================================================================
# T-SQL: Create the AG Helper login on ALL replicas
# ===========================================================================
# Run these commands on EACH SQL Server replica in your Availability Group
# BEFORE deploying the SQLServerAG resource.
#
# Connect using sqlcmd or Azure Data Studio:
#   kubectl exec -it <pod-name> -n mssql -- \
#     /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '<sa-password>' -C
#
# ---------------------------------------------------------------------------
# -- Step 1: Create the login
# ---------------------------------------------------------------------------
# CREATE LOGIN ag_helper WITH PASSWORD = 'AGHelper@Passw0rd!';
# GO
#
# ---------------------------------------------------------------------------
# -- Step 2: Grant required permissions
# ---------------------------------------------------------------------------
# -- VIEW SERVER STATE: Required to query sys.dm_hadr_* DMVs for AG health
# GRANT VIEW SERVER STATE TO ag_helper;
# GO
#
# -- ALTER ANY AVAILABILITY GROUP: Required to perform failover operations
# GRANT ALTER ANY AVAILABILITY GROUP TO ag_helper;
# GO
#
# ---------------------------------------------------------------------------
# -- Verify permissions
# ---------------------------------------------------------------------------
# SELECT 
#     perm.permission_name,
#     perm.state_desc
# FROM sys.server_permissions perm
# JOIN sys.server_principals sp ON perm.grantee_principal_id = sp.principal_id
# WHERE sp.name = 'ag_helper';
# GO
#
# Expected output:
# +-----------------------------+------------+
# | permission_name             | state_desc |
# +-----------------------------+------------+
# | VIEW SERVER STATE           | GRANT      |
# | ALTER ANY AVAILABILITY GROUP| GRANT      |
# +-----------------------------+------------+
#
# ===========================================================================
# Why not use SA?
# ===========================================================================
# The SA account has unrestricted access to everything in SQL Server.
# Using a dedicated login with minimal permissions follows the principle
# of least privilege:
#
# - If the AG Helper sidecar is compromised, attackers only have limited
#   access to view AG state and perform failover (not drop databases, etc.)
# - Easier auditing of what the AG Helper is doing
# - Aligns with Microsoft's Pacemaker documentation for Linux HA
#
# ===========================================================================
# Alternative: Per-Replica Credentials
# ===========================================================================
# If you need different credentials per replica (uncommon), you can use
# the replicaCredentials field in the SQLServerAG spec:
#
# apiVersion: mssql.microsoft.com/v1alpha1
# kind: SQLServerAG
# metadata:
#   name: my-ag
#   namespace: mssql
# spec:
#   availabilityGroup:
#     name: MyAG
#     healthCheckCredentials:
#       secretRef:
#         usernameSecret:
#           name: ag-helper-default
#           key: username
#         passwordSecret:
#           name: ag-helper-default
#           key: password
#     replicaCredentials:
#       "0":  # Primary replica
#         secretRef:
#           usernameSecret:
#             name: ag-helper-primary
#             key: username
#           passwordSecret:
#             name: ag-helper-primary
#             key: password
#       "1":  # First secondary
#         secretRef:
#           usernameSecret:
#             name: ag-helper-secondary1
#             key: username
#           passwordSecret:
#             name: ag-helper-secondary1
#             key: password
#
# ===========================================================================
# Quick Test with Plain Text (NOT RECOMMENDED FOR PRODUCTION)
# ===========================================================================
# For quick dev/test scenarios only, you can specify credentials inline:
#
# availabilityGroup:
#   healthCheckCredentials:
#     username: "ag_helper"
#     password: "TestPassword123!"
#
# WARNING: This exposes credentials in the manifest. Use secrets in production.
