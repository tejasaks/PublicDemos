---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin  # CHANGE THIS in production!
            - name: GF_INSTALL_PLUGINS
              value: ""
            # Anonymous access for demo — disable in production
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: data
              mountPath: /var/lib/grafana
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: LoadBalancer  # Use NodePort if LoadBalancer not available
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana


# ############################################################################
#
#   DEPLOYMENT INSTRUCTIONS
#
# ############################################################################
#
# This sample is designed to be applied in stages. You can either apply the
# entire file at once (Steps 1, 3, and 4 deploy simultaneously) or apply
# each section separately using label selectors or by splitting the file.
#
# ============================================================================
# STEP 1: Deploy SQL Server with Monitoring
# ============================================================================
#
#   kubectl apply -f samples/ag-with-monitoring.yaml
#
#   Wait for all pods — each pod should show 2/2 (mssql-server + sql-exporter):
#   kubectl get pods -n mssql -w
#
#   # Expected:
#   # NAME       READY   STATUS    RESTARTS   AGE
#   # sql-ag-0   2/2     Running   0          2m
#   # sql-ag-1   2/2     Running   0          2m
#   # sql-ag-2   2/2     Running   0          2m
#
#   Verify the sql-exporter sidecar is running on each replica:
#   kubectl get pods -n mssql -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.containers[*]}{.name}{" "}{end}{"\n"}{end}'
#   # Should show: mssql-server sql-exporter (for each pod)
#
#   Verify metrics are being exposed:
#   kubectl port-forward pod/sql-ag-0 -n mssql 9399:9399
#   curl -s http://localhost:9399/metrics | head -20
#
# ============================================================================
# STEP 2: T-SQL Setup (Manual)
# ============================================================================
#
#   Follow ag-step2-setup-ag.md to:
#     - Create AG Helper login on all 3 replicas
#     - Create certificates and mirroring endpoints
#     - Create the Availability Group "ProductionAG"
#     - Join secondary replicas to the AG
#
#   After AG creation, verify AG metrics are exposed:
#   kubectl port-forward pod/sql-ag-0 -n mssql 9399:9399
#   curl -s http://localhost:9399/metrics | grep mssql_ag
#
#   # Expected output:
#   # mssql_ag_is_primary{ag_name="ProductionAG"} 1
#   # mssql_ag_replica_role{ag_name="ProductionAG",replica="sql-ag-0"} 1
#   # mssql_ag_synchronization_health{ag_name="ProductionAG"} 2
#
# ============================================================================
# STEP 3: SQLServerAG deploys automatically (included in the same file)
# ============================================================================
#
#   The SQLServerAG resource was already applied in Step 1 along with the
#   entire file. The operator will reconcile it once the AG exists in SQL
#   Server (after Step 2).
#
#   Verify the AG Helper sidecar was injected (pods show 3/3):
#   kubectl get pods -n mssql -w
#   # Expected: 3/3 Ready (mssql-server + sql-exporter + ag-helper)
#
#   Check AG status:
#   kubectl get sqlserverag -n mssql
#   kubectl describe sqlserverag production-ag -n mssql
#
# ============================================================================
# STEP 4: Access Grafana Dashboards
# ============================================================================
#
#   The monitoring stack (Prometheus + Grafana) was deployed in Step 1.
#
#   OPTION A: Port-forward (development / local access):
#
#     kubectl port-forward svc/grafana -n monitoring 3000:3000
#
#     Open in browser: http://localhost:3000
#     Login: admin / admin (change on first login in production)
#
#   OPTION B: LoadBalancer (cloud environments):
#
#     kubectl get svc grafana -n monitoring
#     # Use the EXTERNAL-IP on port 3000
#
#   OPTION C: NodePort (bare-metal / minikube):
#
#     # Edit the Grafana Service type to NodePort:
#     kubectl patch svc grafana -n monitoring -p '{"spec":{"type":"NodePort"}}'
#     kubectl get svc grafana -n monitoring
#     # Access via <node-ip>:<node-port>
#
#     # For minikube:
#     minikube service grafana -n monitoring
#
#   NAVIGATE TO DASHBOARDS:
#
#     1. Click "Dashboards" in the left sidebar (or press "d" then "b")
#     2. Open the "SQL Server" folder
#     3. Two dashboards are available:
#
#        ┌─────────────────────────────────────────────────────────────┐
#        │  SQL Server AG Monitoring                                   │
#        │  ─────────────────────────────────────────────────────────  │
#        │  • AG Synchronization Health (HEALTHY / PARTIALLY / NOT)   │
#        │  • Replica Roles (PRIMARY / SECONDARY per pod)             │
#        │  • Replica Connected State                                  │
#        │  • Database Sync State (per database per replica)          │
#        │  • Redo Queue Size (secondary lag over time)               │
#        │  • Log Send Queue Size (primary→secondary lag)             │
#        │  • Instance Status (UP/DOWN per replica)                   │
#        │  • CPU / Memory gauges (per replica)                       │
#        │  • Active Connections / Batch Requests (per replica)       │
#        └─────────────────────────────────────────────────────────────┘
#
#        ┌─────────────────────────────────────────────────────────────┐
#        │  SQL Server Overview                                        │
#        │  ─────────────────────────────────────────────────────────  │
#        │  • CPU / Memory gauges (all instances)                     │
#        │  • Active Connections                                       │
#        │  • Batch Requests/sec                                       │
#        │  • Batch Requests Rate (5m trend)                          │
#        │  • Buffer Cache Size (trend)                               │
#        │  • Instance Up/Down status                                 │
#        └─────────────────────────────────────────────────────────────┘
#
# ============================================================================
# STEP 5: Verify Prometheus Targets
# ============================================================================
#
#   Port-forward to Prometheus:
#   kubectl port-forward svc/prometheus -n monitoring 9090:9090
#
#   Open http://localhost:9090/targets in your browser.
#   You should see 3 targets under the "sql-exporter" job:
#
#     Endpoint                        State   Labels
#     ─────────────────────────────   ─────   ──────────────────────────
#     sql-ag-0.mssql:9399/metrics     UP      kubernetes_pod_name=sql-ag-0
#     sql-ag-1.mssql:9399/metrics     UP      kubernetes_pod_name=sql-ag-1
#     sql-ag-2.mssql:9399/metrics     UP      kubernetes_pod_name=sql-ag-2
#
#   Run sample PromQL queries:
#
#   # Check all 3 replicas are up
#   mssql_up{sqlserver_instance="sql-ag"}
#
#   # Show AG health
#   mssql_ag_synchronization_health{ag_name="ProductionAG"}
#
#   # Show replica roles
#   mssql_ag_replica_role{ag_name="ProductionAG"}
#
#   # Show sync state per database
#   mssql_ag_database_synchronization_state{ag_name="ProductionAG"}
#
#   # Show redo lag on secondaries (bytes)
#   mssql_ag_redo_queue_size{ag_name="ProductionAG"}
#
#   # Show CPU on all 3 replicas
#   mssql_cpu_percent{sqlserver_instance="sql-ag"}
#
# ============================================================================
# USEFUL QUERIES FOR GRAFANA EXPLORE
# ============================================================================
#
#   # Which replica is primary?
#   mssql_ag_replica_role{ag_name="ProductionAG"} == 1
#
#   # Any databases NOT synchronized?
#   mssql_ag_database_synchronization_state{ag_name="ProductionAG"} != 2
#
#   # Redo queue > 1GB (indicates secondary falling behind)
#   mssql_ag_redo_queue_size{ag_name="ProductionAG"} > 1073741824
#
#   # CPU over 80% on any replica
#   mssql_cpu_percent{sqlserver_instance="sql-ag"} > 80
#
#   # Memory over 90% on any replica
#   mssql_memory_usage_percent{sqlserver_instance="sql-ag"} > 90
#
#   # Batch requests rate per replica (5 min average)
#   rate(mssql_batch_requests_total{sqlserver_instance="sql-ag"}[5m])
#
#   # Any replica down?
#   mssql_up{sqlserver_instance="sql-ag"} == 0
#
# ############################################################################

# ============================================================================
# CLEANUP
# ============================================================================
#
# To remove all resources created by this sample:
#
# 1. Delete the SQLServerAG (removes AG Helper sidecar):
#    kubectl delete sqlserverag production-ag -n mssql
#
# 2. Delete all resources in this file:
#    kubectl delete -f samples/ag-with-monitoring.yaml
#
# 3. Verify SQL Server resources are removed:
#    kubectl get pods,pvc,svc -n mssql
#
# 4. Delete monitoring resources:
#    kubectl delete namespace monitoring
#
#    Note: The ClusterRole and ClusterRoleBinding are cluster-scoped:
#    kubectl delete clusterrole prometheus-mssql-monitoring
#    kubectl delete clusterrolebinding prometheus-mssql-monitoring
#
# 5. (Optional) Delete the mssql namespace:
#    kubectl delete namespace mssql
#
# 6. (Optional) Delete PVCs manually (not auto-deleted):
#    kubectl delete pvc --all -n mssql
#    kubectl delete pvc --all -n monitoring
#
# 7. To remove the operator itself and all CRDs:
#    kubectl delete -f https://raw.githubusercontent.com/tejasaks/PublicDemos/main/SQLK8sOperator/install.yaml
#
#    Or if installed from a local file:
#    kubectl delete -f install.yaml
#
# NOTE: Deleting CRDs will remove ALL SQLServer and SQLServerAG resources
#       across all namespaces. Make sure no other workloads depend on them.
#
# ============================================================================
