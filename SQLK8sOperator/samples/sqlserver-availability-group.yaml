# SQL Server Availability Group Configuration
# This creates a 3-replica AG with automatic failover
# managed by the AG Helper sidecar

apiVersion: mssql.microsoft.com/v1alpha1
kind: SQLServer
metadata:
  name: mssql-ag-cluster
  namespace: mssql
spec:
  version: "2022"
  edition: Developer  # AG works with Developer or Enterprise edition
  
  instance:
    # 3 replicas for the AG
    replicas: 3
    
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "2"
        memory: 4Gi
    
    storage:
      data:
        size: 50Gi
        storageClass: managed-premium
      log:
        size: 20Gi
        storageClass: managed-premium
      tempdb:
        size: 10Gi
      backup:
        size: 50Gi
    
    config:
      agentEnabled: true
      hadrEnabled: true  # Required for AG
      collation: SQL_Latin1_General_CP1_CI_AS
      lcid: 1033
    
    # Pod anti-affinity for HA
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mssql
                mssql.microsoft.com/instance: mssql-ag-cluster
            topologyKey: kubernetes.io/hostname
  
  credentials:
    saPasswordSecretRef:
      name: mssql-ag-sa-password
      key: password
  
  # Basic service for individual pod access
  service:
    type: ClusterIP
    port: 1433
  
  monitoring:
    enabled: true

---
# Availability Group Configuration
apiVersion: mssql.microsoft.com/v1alpha1
kind: SQLServerAG
metadata:
  name: production-ag
  namespace: mssql
spec:
  # Reference to the SQLServer resource
  sqlServerRef:
    name: mssql-ag-cluster
  
  availabilityGroup:
    # Name of the AG (as it appears in SQL Server)
    name: ProductionAG
    
    # Number of replicas (must match SQLServer.spec.instance.replicas)
    replicas: 3
    
    # Primary replica configuration
    primaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External  # Required for K8s-managed failover
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Secondary replicas configuration
    secondaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Automatic database seeding
    seedingMode: Automatic
    
    # Databases to include in the AG
    databases:
      - name: ApplicationDB
      - name: ReportingDB
    
    # Enable DB_FAILOVER for database-level health detection
    dbFailover: true
    
    # Cluster type is always External for Kubernetes
    clusterType: External
    
    # Port for database mirroring endpoint
    endpointPort: 5022
    
    # External write lease validity (SQL 2019+)
    externalWriteLeaseValidity: "20s"
  
  # Failover configuration
  failover:
    # Enable automatic failover
    automatic: true
    
    # Data loss threshold (0 = no data loss allowed)
    dataLossThreshold: 0
    
    # Health check timeout
    healthCheckTimeout: "30s"
    
    # Lease timeout for primary writes
    leaseTimeout: "60s"
    
    # Required synchronized secondaries (-1 = auto-calculate)
    requiredSynchronizedSecondaries: -1
  
  # Service endpoints for the AG
  endpoints:
    # Primary endpoint - routes to current primary
    primary:
      type: LoadBalancer
      port: 1433
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    
    # Secondary endpoint - routes to readable secondaries
    secondary:
      type: LoadBalancer
      port: 1433
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  
  # AG Helper sidecar configuration
  sidecar:
    image: mssql-ag-helper:latest
    monitorInterval: "10s"
    connectionTimeout: "30s"

---
apiVersion: v1
kind: Secret
metadata:
  name: mssql-ag-sa-password
  namespace: mssql
type: Opaque
stringData:
  password: "YourStrong@Passw0rd!"
