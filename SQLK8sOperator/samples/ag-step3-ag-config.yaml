# ============================================================================
# STEP 3: SQLServerAG Configuration (Kubernetes AG Management)
# ============================================================================
#
# This manifest creates a SQLServerAG resource for Kubernetes management of your
# Availability Group. The operator monitors AG health and can perform failover.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  FAILOVER MODES                                                         │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  automaticFailover: false (DEFAULT - Recommended for most deployments) │
# │  ─────────────────────────────────────────────────────────────────────  │
# │  • Operator monitors AG health via AG Helper pod                        │
# │  • Failover is MANUAL (via kubectl annotate or T-SQL)                   │
# │  • Gives DBA full control over failover decisions                       │
# │                                                                         │
# │  automaticFailover: true (Production deployments with HA requirements)  │
# │  ─────────────────────────────────────────────────────────────────────  │
# │  • All monitoring features above, PLUS:                                 │
# │  • Controller-managed AUTOMATIC failover                                │
# │  • Operator detects primary failure and promotes best secondary         │
# │  • Configure thresholds via failover.healthCheckTimeout                 │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ARCHITECTURE:
#   Each SQLServerAG resource manages exactly ONE Availability Group.
#   The AG name must be specified explicitly in 'availabilityGroup.name'.
#   For multiple AGs, create multiple SQLServerAG resources.
#
# WHAT THIS PROVIDES:
#   ✅ AG health monitoring via AG Helper pod (one per SQLServerAG)
#   ✅ Manual failover via kubectl annotate
#   ✅ Optional automatic failover (when automaticFailover: true)
#   ✅ Status tracking (primary replica, sync state, health)
#   ✅ Optional AG Listener (K8s Service that routes to primary)
#
# CONNECTING TO THE AG:
#   Option 1: Via Listener (if configured)
#     - Single VIP that always routes to current primary
#     - kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener.vip}'
#
#   Option 2: Direct replica access (always available)
#     - Use the individual replica services: sql-ag-0, sql-ag-1, sql-ag-2
#     - Find primary: kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.primaryReplica}'
#
# PREREQUISITES:
#   - ag-step1-replicas.yaml applied
#   - T-SQL steps from ag-step2-setup-ag.md completed
#   - AG exists in SQL Server (name must match 'availabilityGroup.name' below)
#
# ============================================================================

---
apiVersion: mssql.microsoft.com/v1alpha1
kind: SQLServerAG
metadata:
  name: production-ag
  namespace: mssql
spec:
  description: "Production AG with K8s monitoring and controller-managed failover"
  
  # Reference to the SQLServer resource created in Step 1
  sqlServerRef:
    name: sql-ag
  
  # Availability Group configuration
  # NOTE: The AG itself was created via T-SQL in Step 2
  # This references that existing AG for Kubernetes management
  availabilityGroup:
    # Must match the AG name created in T-SQL
    name: ProductionAG
    
    # Number of instances (informational, must match SQLServer.spec.instance.count)
    instanceCount: 3
    
    # Primary replica configuration (reference, actual config is in T-SQL)
    primaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Secondary replicas configuration
    secondaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Seeding mode (reference only - actual mode set in T-SQL)
    seedingMode: Automatic
    
    # Cluster type is always External for Kubernetes
    clusterType: External
    
    # Endpoint port (must match T-SQL CREATE ENDPOINT port)
    endpointPort: 5022
    
    # Enable database-level failover
    dbFailover: true
    
    # Automatic failover mode (defaults to false for manual failover)
    # Set to true for controller-driven automatic failover when primary fails
    automaticFailover: false
    
    # Health check credentials (same as Step 1)
    healthCheckCredentials:
      secretRef:
        usernameSecret:
          name: sql-ag-helper
          key: username
        passwordSecret:
          name: sql-ag-helper
          key: password
  
  # ============================================================================
  # AG LISTENER CONFIGURATION (OPTIONAL)
  # ============================================================================
  # The listener section is OPTIONAL. Omit it entirely for:
  #   - DR scenarios where you connect directly to replicas
  #   - Manual failover scenarios with direct replica access
  #   - Testing/development environments
  #
  # When configured, the operator creates a Kubernetes Service (VIP) that always
  # routes to the current primary replica. This is different from traditional
  # WSFC listeners because Kubernetes manages the VIP and Endpoints, not SQL Server.
  #
  # WORKFLOW (when listener is configured):
  #   1. Apply this manifest - operator creates Service with VIP
  #   2. Get the VIP: kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener.vip}'
  #   3. Create AG Listener in SQL Server using the VIP (T-SQL)
  #   4. Operator detects listener and transitions to Ready phase
  #
  # PHASES:
  #   - Pending: Service being created
  #   - WaitingForListener: VIP available, waiting for T-SQL listener creation
  #   - Ready: Listener configured and routing to primary
  #   - Degraded: Listener exists but no primary available
  #   - Maintenance: Listener suspended (via annotation)
  #
  # To DISABLE listener, simply remove or comment out the entire 'listener:' block.
  #
  listener:
    # Name of the listener Service (also used for DNS)
    # Must be DNS-compatible: lowercase, alphanumeric, hyphens only
    name: productionag-listener
    
    # Port for the listener (default 1433)
    # Use a non-default port for security or multi-instance scenarios
    port: 1433
    
    # Service type: ClusterIP (default), LoadBalancer, or NodePort
    # ClusterIP: Internal cluster access only
    # LoadBalancer: External access via cloud load balancer
    serviceType: ClusterIP
    
    # Optional: Specify a static ClusterIP (must be in cluster's service CIDR)
    # If not specified, Kubernetes assigns one automatically
    # clusterIP: "10.96.100.50"
    
    # Optional: For LoadBalancer type, request a specific external IP
    # loadBalancerIP: "20.50.100.25"
    
    # Optional: Custom annotations for the listener Service
    # Useful for cloud-specific configurations
    # annotations:
    #   service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    #   external-dns.alpha.kubernetes.io/hostname: "productionag.example.com"

  # Failover configuration
  failover:
    # Enable automatic failover via controller
    automatic: true
    
    # Data loss threshold (0 = no data loss allowed)
    dataLossThreshold: 0
    
    # Health check timeout before declaring primary lost
    healthCheckTimeout: "30s"
    
    # Lease timeout for primary writes
    leaseTimeout: "60s"
    
    # Required synchronized secondaries (-1 = auto-calculate based on replica count)
    requiredSynchronizedSecondaries: -1
  
  # AG Helper sidecar configuration
  sidecar:
    image: ghcr.io/tejasaks/mssql-ag-helper:v1.0.0
    monitorInterval: "10s"
    connectionTimeout: "30s"
    # Connection resilience: retry transient SQL errors before declaring unhealthy
    maxRetries: 3             # Number of retry attempts per query (1-30)
    retryInterval: "5s"       # Delay between retry attempts
    stalenessThreshold: "30s" # Data older than this triggers stale warnings

# ============================================================================
# USAGE
# ============================================================================
#
# 1. Apply this manifest:
#    kubectl apply -f ag-step3-ag-config.yaml
#
# 2. Get the listener VIP and subnet mask:
#    # Get the VIP
#    kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener.vip}'
#
#    # Get the cluster service CIDR (for subnet mask)
#    # Method 1: From kubeadm config (if available)
#    kubectl get cm kubeadm-config -n kube-system -o jsonpath='{.data.ClusterConfiguration}' | grep serviceSubnet
#
#    # Method 2: From kube-apiserver (check --service-cluster-ip-range flag)
#    kubectl get pod -n kube-system -l component=kube-apiserver -o yaml | grep service-cluster-ip-range
#
#    # Method 3: Infer from existing services (most reliable)
#    kubectl get svc -A -o jsonpath='{.items[*].spec.clusterIP}' | tr ' ' '\n' | sort -u | head -5
#
#    Common subnet masks by CIDR:
#      /12 = 255.240.0.0    (e.g., 10.96.0.0/12)
#      /16 = 255.255.0.0    (e.g., 10.0.0.0/16)
#      /20 = 255.255.240.0
#      /24 = 255.255.255.0  (e.g., 10.96.0.0/24)
#
# 3. Create AG Listener in SQL Server using the VIP:
#    -- Run on PRIMARY replica (connect to sql-ag-0 or current primary)
#    -- Replace <VIP> and <SUBNET_MASK> with values from step 2
#    ALTER AVAILABILITY GROUP [ProductionAG]
#    ADD LISTENER 'productionag-listener' (
#        WITH IP (('<VIP>', '<SUBNET_MASK>')),
#        PORT = 1433
#    );
#
# 4. Verify listener is Ready:
#    kubectl get sqlserverag production-ag -n mssql -o wide
#    # Check the "Listener" column shows "Ready"
#
# 5. Connect using the listener (always routes to primary):
#    sqlcmd -S <VIP>,1433 -U sa -P 'YourStrong@Passw0rd!'
#
# ============================================================================
# LISTENER STATUS
# ============================================================================
#
# Check listener status:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener}'
#
# Check listener phase:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener.phase}'
#
# Get listener VIP:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.listener.vip}'
#
# Get listener Service details:
#   kubectl get svc productionag-listener -n mssql
#
# View listener Endpoints (should show primary pod IP):
#   kubectl get endpoints productionag-listener -n mssql -o yaml
#
# ============================================================================
# LISTENER MAINTENANCE MODE
# ============================================================================
#
# To put the listener in maintenance mode (stops routing warnings):
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/listener-maintenance=true
#
# To exit maintenance mode:
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/listener-maintenance-
#
# ============================================================================
# MANUAL FAILOVER (via kubectl)
# ============================================================================
#
# To manually failover to a specific replica, use the annotation:
#
#   # Failover to sql-ag-1
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/failover-to=sql-ag-1
#
#   # Check failover status
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.metadata.annotations}'
#
#   # Watch for primary change (listener Endpoints will update automatically)
#   kubectl get sqlserverag production-ag -n mssql -w
#
# To cancel/clear a failed failover request:
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/failover-to- \
#     mssql.microsoft.com/failover-status- \
#     mssql.microsoft.com/failover-requested-
#
# ============================================================================
# OTHER KUBECTL COMMANDS
# ============================================================================
#
# View AG status and primary replica:
#   kubectl get sqlserverag -n mssql
#
# View detailed AG status with replica health:
#   kubectl describe sqlserverag production-ag -n mssql
#
# View AG replica status (JSON):
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.replicas}' | jq
#
# Check which replica is primary:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.primaryReplica}'
#
# Check synchronization count:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.synchronizedReplicas}'
#
# View events (including failovers and listener updates):
#   kubectl get events -n mssql --field-selector involvedObject.name=production-ag
#
# ============================================================================
# TROUBLESHOOTING
# ============================================================================
#
# If listener is stuck in "WaitingForListener":
#   1. Get the VIP and create the AG Listener in SQL Server via T-SQL
#   2. Verify the listener exists in SQL Server:
#      SELECT * FROM sys.availability_group_listeners
#
# If listener shows "Degraded":
#   1. Check if there's a primary replica:
#      kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.primaryReplica}'
#   2. If no primary, check AG health and consider failover
#
# If connections fail through listener:
#   1. Check Endpoints have the correct primary IP:
#      kubectl get endpoints productionag-listener -n mssql
#   2. Verify the primary pod is Ready:
#      kubectl get pod <primary-pod-name> -n mssql
#
# If reconciliation is failing:
#
# 1. Check if the SQLServer resource is Ready:
#    kubectl get sqlserver sql-ag -n mssql -o jsonpath='{.status.ready}'
#    # Must return "true" - AG reconciliation waits for SQLServer to be Ready
#
# 2. Check operator logs for errors:
#    kubectl logs deployment/mssql-operator -n mssql-system --tail=100
#
# 3. Check SQLServerAG status for issues:
#    kubectl describe sqlserverag production-ag -n mssql
#
# 4. Check events for any warnings:
#    kubectl get events -n mssql --sort-by='.lastTimestamp' | tail -20
#
# 5. Verify sqlServerRef.name matches your SQLServer resource:
#    kubectl get sqlserver -n mssql
#    # The name must match spec.sqlServerRef.name (e.g., "sql-ag")
#
# 6. Force a re-reconcile by patching the resource:
#    kubectl annotate sqlserverag production-ag -n mssql force-reconcile=$(date +%s)
#
# ============================================================================
#
# ============================================================================
# CLEANUP
# ============================================================================
#
# To remove resources created by this sample:
#
# 1. Delete the SQLServerAG resource (removes AG Helper sidecar and services):
#    kubectl delete -f samples/ag-step3-ag-config.yaml
#
#    Or by name:
#    kubectl delete sqlserverag production-ag -n mssql
#
# 2. Verify the AG Helper sidecar was removed from pods:
#    kubectl get pods -n mssql -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{range .spec.containers[*]}{.name}{" "}{end}{"\n"}{end}'
#    # Should show only mssql-server (no ag-helper)
#
# 3. (Optional) Also remove the SQLServer replicas from step 1:
#    kubectl delete -f samples/ag-step1-replicas.yaml
#
# 4. (Optional) Delete the namespace to remove everything:
#    kubectl delete namespace mssql
#
# 5. To remove the operator itself and all CRDs:
#    kubectl delete -f https://raw.githubusercontent.com/tejasaks/PublicDemos/main/SQLK8sOperator/install.yaml
#
#    Or if installed from a local file:
#    kubectl delete -f install.yaml
#
# NOTE: Deleting CRDs will remove ALL SQLServer and SQLServerAG resources
#       across all namespaces. Make sure no other workloads depend on them.
#
# ============================================================================
