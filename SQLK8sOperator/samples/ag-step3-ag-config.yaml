# ============================================================================
# STEP 3: SQLServerAG Configuration (Kubernetes AG Management)
# ============================================================================
#
# This manifest creates a SQLServerAG resource for Kubernetes management of your
# Availability Group. The operator monitors AG health and manages Kubernetes
# services that route traffic to the appropriate replicas.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  FAILOVER MODES                                                         │
# ├─────────────────────────────────────────────────────────────────────────┤
# │  automaticFailover: false (DEFAULT - Recommended for most deployments) │
# │  ─────────────────────────────────────────────────────────────────────  │
# │  • Operator monitors AG health via AG Helper pod                        │
# │  • LoadBalancer services route traffic to primary/secondaries           │
# │  • Failover is MANUAL (via kubectl annotate or T-SQL)                   │
# │  • Gives DBA full control over failover decisions                       │
# │                                                                         │
# │  automaticFailover: true (Production deployments with HA requirements)  │
# │  ─────────────────────────────────────────────────────────────────────  │
# │  • All monitoring features above, PLUS:                                 │
# │  • Controller-managed AUTOMATIC failover                                │
# │  • Operator detects primary failure and promotes best secondary         │
# │  • Configure thresholds via failover.healthCheckTimeout                 │
# └─────────────────────────────────────────────────────────────────────────┘
#
# ARCHITECTURE:
#   Each SQLServerAG resource manages exactly ONE Availability Group.
#   The AG name must be specified explicitly in 'availabilityGroup.name'.
#   For multiple AGs, create multiple SQLServerAG resources.
#
# WHAT THIS PROVIDES:
#   ✅ Primary LoadBalancer service - routes traffic to current primary
#      (named <AG-name>-primary, e.g., ProductionAG-primary)
#   ✅ Secondary LoadBalancer service - routes read traffic to secondaries
#      (named <AG-name>-secondary, e.g., ProductionAG-secondary)
#   ✅ AG health monitoring via AG Helper pod (one per SQLServerAG)
#   ✅ Manual failover via kubectl annotate
#   ✅ Optional automatic failover (when automaticFailover: true)
#
# PREREQUISITES:
#   - ag-step1-replicas.yaml applied
#   - T-SQL steps from ag-step2-setup-ag.md completed
#   - AG exists in SQL Server (name must match 'availabilityGroup.name' below)
#
# ============================================================================

---
apiVersion: mssql.microsoft.com/v1alpha1
kind: SQLServerAG
metadata:
  name: production-ag
  namespace: mssql
spec:
  description: "Production AG with K8s services and controller-managed failover"
  
  # Reference to the SQLServer resource created in Step 1
  sqlServerRef:
    name: sql-ag
  
  # Availability Group configuration
  # NOTE: The AG itself was created via T-SQL in Step 2
  # This references that existing AG for Kubernetes management
  availabilityGroup:
    # Must match the AG name created in T-SQL
    name: ProductionAG
    
    # Number of replicas (informational, must match SQLServer.spec.instance.replicas)
    replicas: 3
    
    # Primary replica configuration (reference, actual config is in T-SQL)
    primaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Secondary replicas configuration
    secondaryConfig:
      availabilityMode: SynchronousCommit
      failoverMode: External
      readableSecondary: ReadOnly
      sessionTimeout: 10
    
    # Seeding mode (reference only - actual mode set in T-SQL)
    seedingMode: Automatic
    
    # Cluster type is always External for Kubernetes
    clusterType: External
    
    # Endpoint port (must match T-SQL CREATE ENDPOINT port)
    endpointPort: 5022
    
    # Enable database-level failover
    dbFailover: true
    
    # Automatic failover mode (defaults to false for manual failover)
    # Set to true for controller-driven automatic failover when primary fails
    automaticFailover: false
    
    # Health check credentials (same as Step 1)
    healthCheckCredentials:
      secretRef:
        usernameSecret:
          name: sql-ag-helper
          key: username
        passwordSecret:
          name: sql-ag-helper
          key: password
  
  # Failover configuration
  failover:
    # Enable automatic failover via controller
    automatic: true
    
    # Data loss threshold (0 = no data loss allowed)
    dataLossThreshold: 0
    
    # Health check timeout before declaring primary lost
    healthCheckTimeout: "30s"
    
    # Lease timeout for primary writes
    leaseTimeout: "60s"
    
    # Required synchronized secondaries (-1 = auto-calculate based on replica count)
    requiredSynchronizedSecondaries: -1
  
  # Kubernetes Service endpoints for the AG
  # These services route traffic to current primary or secondaries
  endpoints:
    # Primary endpoint - always routes to current primary replica
    primary:
      type: LoadBalancer
      port: 1433
      annotations: {}
      # For minikube: use 'minikube tunnel' to get external IP
      # For cloud: LoadBalancer creates external IP automatically
      #
      # Alternatives:
      # type: NodePort
      # nodePort: 31433
      #
      # type: ClusterIP  # Internal only
    
    # Secondary endpoint - routes to readable secondaries only
    secondary:
      type: LoadBalancer
      port: 1434
      annotations: {}
      # Route read-only traffic here for read scale-out
      #
      # Alternatives:
      # type: NodePort
      # nodePort: 31434
  
  # AG Helper sidecar configuration
  sidecar:
    image: mssql-ag-helper:latest
    monitorInterval: "10s"
    connectionTimeout: "30s"

# ============================================================================
# USAGE
# ============================================================================
#
# 1. Apply this manifest:
#    kubectl apply -f ag-step3-ag-config.yaml
#
# 2. Verify SQLServerAG resource:
#    kubectl get sqlserverag -n mssql
#
# 3. Check services created (uses AG name from T-SQL, not resource name):
#    kubectl get svc -n mssql
#    # Should see: ProductionAG-primary, ProductionAG-secondary
#    # (Service names use the availabilityGroup.name field, e.g., "ProductionAG")
#
# 4. Connect to primary:
#    # Get LoadBalancer IP
#    kubectl get svc ProductionAG-primary -n mssql
#    
#    # Connect (primary always routes to current primary)
#    sqlcmd -S <PRIMARY_IP>,1433 -U sa -P 'YourStrong@Passw0rd!'
#
# 5. Connect to secondary (read-only):
#    kubectl get svc ProductionAG-secondary -n mssql
#    
#    # Read-only connection to secondaries
#    sqlcmd -S <SECONDARY_IP>,1434 -U sa -P 'YourStrong@Passw0rd!'
#
# ============================================================================
# MANUAL FAILOVER (via kubectl)
# ============================================================================
#
# To manually failover to a specific replica, use the annotation:
#
#   # Failover to sql-ag-1
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/failover-to=sql-ag-1
#
#   # Check failover status
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.metadata.annotations}'
#
#   # Watch for primary change
#   kubectl get sqlserverag production-ag -n mssql -w
#
# To cancel/clear a failed failover request:
#   kubectl annotate sqlserverag production-ag -n mssql \
#     mssql.microsoft.com/failover-to- \
#     mssql.microsoft.com/failover-status- \
#     mssql.microsoft.com/failover-requested-
#
# ============================================================================
# OTHER KUBECTL COMMANDS
# ============================================================================
#
# View AG status and primary replica:
#   kubectl get sqlserverag -n mssql
#
# View detailed AG status with replica health:
#   kubectl describe sqlserverag production-ag -n mssql
#
# View AG replica status (JSON):
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.replicas}' | jq
#
# Check which replica is primary:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.primaryReplica}'
#
# Check synchronization count:
#   kubectl get sqlserverag production-ag -n mssql -o jsonpath='{.status.synchronizedReplicas}'
#
# View events (including failovers):
#   kubectl get events -n mssql --field-selector involvedObject.name=production-ag
#
# ============================================================================
