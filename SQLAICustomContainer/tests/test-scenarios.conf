# Test Scenarios Configuration
# Format: SCENARIO_NAME|INSTALL_OLLAMA|INSTALL_MINIO|ENABLE_POLYBASE|DESCRIPTION

# Minimal configurations
minimal|false|false|false|SQL Server + FTS only (minimal)
polybase|false|false|true|SQL Server + FTS + Polybase
minio|false|true|false|SQL Server + FTS + MinIO
ollama|true|false|false|SQL Server + FTS + Ollama (default)
ollama-polybase|true|false|true|SQL Server + FTS + Ollama + Polybase
ollama-minio|true|true|false|SQL Server + FTS + Ollama + MinIO
full-stack|true|true|true|All components enabled

# Notes:
# - All scenarios include SQL Server 2025 + Full-Text Search (base requirement)
# - INSTALL_OLLAMA defaults to true in Dockerfile but we test both ways
# - INSTALL_MINIO defaults to false in Dockerfile
# - ENABLE_POLYBASE defaults to false in Dockerfile
